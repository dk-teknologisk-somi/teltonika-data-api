name: Build executables

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: teltonika-data-api-windows-x64.exe
            binary: dist/teltonika-data-api.exe
          # Oldest available Ubuntu keeps the glibc requirement low (2.35).
          - os: ubuntu-22.04
            artifact: teltonika-data-api-linux-x64
            binary: dist/teltonika-data-api
          - os: ubuntu-22.04-arm
            artifact: teltonika-data-api-linux-arm64
            binary: dist/teltonika-data-api
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements/dev.txt -r requirements/build.txt
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller packaging/teltonika-data-api.spec --noconfirm
      - shell: bash
        run: mv "${{ matrix.binary }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.artifact }}" --clobber
